<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的喵喵</title>
<meta name="description" content="喵喵的常用网站快捷入口">
<meta name="theme-color" content="#1b2233">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f06aa0'/%3E%3Ccircle cx='24' cy='27' r='3.2' fill='white'/%3E%3Ccircle cx='40' cy='27' r='3.2' fill='white'/%3E%3Cpath d='M32 35c-4 0-7 2.6-7 5.2 0 2.6 3.1 4.8 7 4.8s7-2.2 7-4.8c0-2.6-3-5.2-7-5.2z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --text: #ffffff;
    --muted: rgba(255, 255, 255, .74);
    --card: rgba(255, 255, 255, .17);
    --line: rgba(255, 255, 255, .28);
    --brand: #ff9ec7;
    --radius: 20px;
  }

  * { box-sizing: border-box; }

  html {
    height: 100%;
    background-color: #1b2233;   /* 图片加载前的底色，避免白闪 */
  }

  /* 背景照片层 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    background-image: url("bg.jpg");
    background-size: cover;
    background-position: center 22%;
    background-repeat: no-repeat;
  }

  /* 压暗层：保证白色文字在照片上依然清楚 */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(11, 16, 28, .40) 0%, rgba(11, 16, 28, .24) 38%, rgba(11, 16, 28, .70) 100%),
      radial-gradient(120% 90% at 50% 0%, rgba(255, 158, 199, .10) 0%, transparent 55%);
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    width: 100%;
    max-width: 720px;
    margin: auto;
  }

  header { text-align: center; margin-bottom: 34px; }

  .avatar {
    width: 64px; height: 64px;
    margin: 0 auto 18px;
    border-radius: 20px;
    display: grid; place-items: center;
    font-size: 28px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #ffa9cd, #f06aa0 60%, #d94f87);
    box-shadow: 0 12px 30px rgba(240, 106, 160, .40), inset 0 1px 0 rgba(255, 255, 255, .35);
  }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(24px, 5vw, 34px);
    letter-spacing: 2px;
    text-shadow: 0 2px 18px rgba(0, 0, 0, .45);
  }

  .sub {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: .5px;
    text-shadow: 0 1px 10px rgba(0, 0, 0, .4);
  }

  .links {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
    gap: 16px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .22), inset 0 1px 0 rgba(255, 255, 255, .18);
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
  }

  .link-card:hover,
  .link-card:focus-visible {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, .20);
    border-color: rgba(255, 158, 199, .65);
    box-shadow: 0 18px 38px rgba(0, 0, 0, .30), inset 0 1px 0 rgba(255, 255, 255, .25);
    outline: none;
  }

  .link-card:active { transform: translateY(-1px); }

  .icon {
    flex: 0 0 46px;
    width: 46px; height: 46px;
    border-radius: 14px;
    display: grid; place-items: center;
    background: #fff;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .22);
  }

  .icon svg { width: 26px; height: 26px; display: block; }

  .meta { min-width: 0; }

  .meta .name {
    display: block;
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 3px;
    line-height: 1.3;
    text-shadow: 0 1px 6px rgba(0, 0, 0, .35);
  }

  .meta .desc {
    display: block;
    margin: 0;
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .arrow {
    margin-left: auto;
    color: rgba(255, 255, 255, .55);
    font-size: 16px;
    transition: color .18s ease, transform .18s ease;
  }

  .link-card:hover .arrow {
    color: var(--brand);
    transform: translateX(3px);
  }

  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12.5px;
    color: rgba(255, 255, 255, .60);
    letter-spacing: .5px;
    text-shadow: 0 1px 8px rgba(0, 0, 0, .4);
  }

  @media (max-width: 640px) {
    /* 手机上用体积更小的背景图，加载更快 */
    body::before { background-image: url("bg-small.jpg"); }
  }

  @media (max-width: 420px) {
    body { padding: 28px 16px; }
    .link-card { padding: 15px; }
    .avatar { width: 56px; height: 56px; border-radius: 18px; font-size: 24px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="avatar">喵</div>
      <h1>我的喵喵</h1>
      <p class="sub">常用网站，一键直达</p>
    </header>

    <!--
      以后想加网站，复制下面一整段 <a class="link-card"> ... </a>，
      把 href 换成目标网址、name 换成站名、desc 换成域名说明即可。
    -->
    <nav class="links" aria-label="常用网站">
      <a class="link-card" href="https://www.baidu.com" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" role="img">
            <path fill="#2932E1" d="M16.9 3.4c1.6-.2 2.6 1.2 2.5 3-.1 1.9-1.2 3.7-2.8 4.3-1.7.6-2.7-.8-2.6-2.7.1-1.8 1.2-3.7 2.9-4.6z"/>
            <path fill="#2932E1" d="M22.6 8.6c2 .1 3.2 2 2.9 4.4-.3 2.3-1.8 4.3-3.7 4.6-1.9.3-3.1-1.4-3-3.7.1-2.3 1.7-4.5 3.8-5.3z"/>
            <path fill="#2932E1" d="M10.4 8.7c1.9-.8 3.7 1 4.2 3.3.5 2.3-.5 4.6-2.2 5.2-2 .7-3.7-.9-4.1-3.3-.4-2.3.6-4.5 2.1-5.2z"/>
            <path fill="#2932E1" d="M4.9 17.2c1.6-1.5 3.9-1 5 1 1.1 1.9.7 4.3-1 5.2-1.8 1-3.9.2-4.8-1.8-.8-1.9-.6-3.6.8-4.4z"/>
            <path fill="#2932E1" d="M16 15.6c-4.3 0-7.8 3.1-7.8 6.9 0 3.8 3.5 6.9 7.8 6.9s7.8-3.1 7.8-6.9c0-3.8-3.5-6.9-7.8-6.9zm-3 8.4c-.9 0-1.6-.9-1.6-2s.7-2 1.6-2 1.6.9 1.6 2-.7 2-1.6 2zm6 0c-.9 0-1.6-.9-1.6-2s.7-2 1.6-2 1.6.9 1.6 2-.7 2-1.6 2z"/>
          </svg>
        </span>
        <span class="meta">
          <span class="name">百度</span>
          <span class="desc">www.baidu.com</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="link-card" href="https://www.bilibili.com" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" role="img">
            <rect x="2.5" y="7" width="27" height="20" rx="5" fill="#00A1D6"/>
            <path d="M9.5 3.6l4.4 3.6M22.5 3.6l-4.4 3.6" stroke="#00A1D6" stroke-width="2.6" stroke-linecap="round" fill="none"/>
            <rect x="8" y="12.5" width="5.6" height="7" rx="1.8" fill="#fff"/>
            <rect x="18.4" y="12.5" width="5.6" height="7" rx="1.8" fill="#fff"/>
          </svg>
        </span>
        <span class="meta">
          <span class="name">哔哩哔哩</span>
          <span class="desc">www.bilibili.com</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <footer>
      <span id="year">2026</span> · 我的喵喵
    </footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
