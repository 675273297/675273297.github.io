<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的导航</title>
<meta name="description" content="常用网站快捷入口">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6df6'/%3E%3Cpath d='M20 40V24h10a8 8 0 0 1 0 16H20z' fill='none' stroke='white' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg-1: #eef4ff;
    --bg-2: #f7f9fc;
    --card: rgba(255, 255, 255, .78);
    --line: rgba(24, 39, 75, .08);
    --text: #16233a;
    --muted: #6b7a95;
    --brand: #2f6df6;
    --radius: 20px;
  }

  * { box-sizing: border-box; }

  html { height: 100%; background-color: #eef3fa; }

  /* 固定铺满视口的背景层：无论窗口多高都不会露白边 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(900px 520px at 12% -10%, #d9e6ff 0%, transparent 62%),
      radial-gradient(820px 500px at 92% 0%, #ddf3ea 0%, transparent 58%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 55%, #eef3fa 100%);
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    width: 100%;
    max-width: 720px;
    margin: auto;
  }

  header { text-align: center; margin-bottom: 34px; }

  .avatar {
    width: 62px; height: 62px;
    margin: 0 auto 18px;
    border-radius: 18px;
    display: grid; place-items: center;
    font-size: 26px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #4b8bff, #2f6df6 60%, #1f4fd0);
    box-shadow: 0 10px 26px rgba(47, 109, 246, .32);
  }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(24px, 5vw, 32px);
    letter-spacing: .5px;
  }

  .sub {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }

  .links {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(24, 39, 75, .06);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }

  .link-card:hover,
  .link-card:focus-visible {
    transform: translateY(-3px);
    border-color: rgba(47, 109, 246, .35);
    box-shadow: 0 16px 34px rgba(24, 39, 75, .13);
    outline: none;
  }

  .link-card:active { transform: translateY(-1px); }

  .icon {
    flex: 0 0 46px;
    width: 46px; height: 46px;
    border-radius: 14px;
    display: grid; place-items: center;
    background: #fff;
    box-shadow: 0 4px 12px rgba(24, 39, 75, .10);
  }

  .icon svg { width: 26px; height: 26px; display: block; }

  .meta { min-width: 0; }

  .meta .name {
    display: block;
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 3px;
    line-height: 1.3;
  }

  .meta .desc {
    display: block;
    margin: 0;
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .arrow {
    margin-left: auto;
    color: #b8c4d8;
    font-size: 16px;
    transition: color .18s ease, transform .18s ease;
  }

  .link-card:hover .arrow {
    color: var(--brand);
    transform: translateX(3px);
  }

  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
  }

  @media (max-width: 420px) {
    body { padding: 28px 16px; }
    .link-card { padding: 15px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="avatar">导</div>
      <h1>我的导航</h1>
      <p class="sub">常用网站，一键直达</p>
    </header>

    <!--
      以后想加网站，复制下面一整段 <a class="link-card"> ... </a>，
      把 href 换成目标网址、name 换成站名、desc 换成域名说明即可。
    -->
    <nav class="links" aria-label="常用网站">
      <a class="link-card" href="https://www.baidu.com" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" role="img">
            <path fill="#2932E1" d="M16.9 3.4c1.6-.2 2.6 1.2 2.5 3-.1 1.9-1.2 3.7-2.8 4.3-1.7.6-2.7-.8-2.6-2.7.1-1.8 1.2-3.7 2.9-4.6z"/>
            <path fill="#2932E1" d="M22.6 8.6c2 .1 3.2 2 2.9 4.4-.3 2.3-1.8 4.3-3.7 4.6-1.9.3-3.1-1.4-3-3.7.1-2.3 1.7-4.5 3.8-5.3z"/>
            <path fill="#2932E1" d="M10.4 8.7c1.9-.8 3.7 1 4.2 3.3.5 2.3-.5 4.6-2.2 5.2-2 .7-3.7-.9-4.1-3.3-.4-2.3.6-4.5 2.1-5.2z"/>
            <path fill="#2932E1" d="M4.9 17.2c1.6-1.5 3.9-1 5 1 1.1 1.9.7 4.3-1 5.2-1.8 1-3.9.2-4.8-1.8-.8-1.9-.6-3.6.8-4.4z"/>
            <path fill="#2932E1" d="M16 15.6c-4.3 0-7.8 3.1-7.8 6.9 0 3.8 3.5 6.9 7.8 6.9s7.8-3.1 7.8-6.9c0-3.8-3.5-6.9-7.8-6.9zm-3 8.4c-.9 0-1.6-.9-1.6-2s.7-2 1.6-2 1.6.9 1.6 2-.7 2-1.6 2zm6 0c-.9 0-1.6-.9-1.6-2s.7-2 1.6-2 1.6.9 1.6 2-.7 2-1.6 2z"/>
          </svg>
        </span>
        <span class="meta">
          <span class="name">百度</span>
          <span class="desc">www.baidu.com</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="link-card" href="https://www.bilibili.com" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" role="img">
            <rect x="2.5" y="7" width="27" height="20" rx="5" fill="#00A1D6"/>
            <path d="M9.5 3.6l4.4 3.6M22.5 3.6l-4.4 3.6" stroke="#00A1D6" stroke-width="2.6" stroke-linecap="round" fill="none"/>
            <rect x="8" y="12.5" width="5.6" height="7" rx="1.8" fill="#fff"/>
            <rect x="18.4" y="12.5" width="5.6" height="7" rx="1.8" fill="#fff"/>
          </svg>
        </span>
        <span class="meta">
          <span class="name">哔哩哔哩</span>
          <span class="desc">www.bilibili.com</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <footer>
      <span id="year">2026</span> · 我的个人导航页
    </footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
