<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探索 · 慢岛生活</title>
<meta name="description" content="点选地图上的国家与省份，加上类型与关键词，一步跳到各平台已搜好的页面。">
<meta name="theme-color" content="#faf7f2">
<link rel="canonical" href="https://mandao.life/explore.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23faf7f2'/%3E%3Ccircle cx='24' cy='21' r='9.5' fill='none' stroke='%23c67b4e' stroke-width='2'/%3E%3Cpath d='M6 32c4.5-4.2 9-6 18-6s13.5 1.8 18 6' fill='none' stroke='%236b7f5e' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles/global.css">
<link rel="stylesheet" href="styles/explore.css?v=4">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="慢岛生活 首页">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none" role="img" aria-label="慢岛生活">
        <circle cx="24" cy="21" r="9.5" stroke="var(--clay)" stroke-width="1.6" opacity="0.9"/>
        <path d="M6 32c4.5-4.2 9-6 18-6s13.5 1.8 18 6" stroke="var(--moss)" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M9 38.5c3.2 2.4 6.4 2.4 9.6 0s6.4-2.4 9.6 0 6.4 2.4 9.6 0" stroke="var(--moss)" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
        <path d="M24 26v-6M24 24.5c-2.1 0-3.4-1.3-3.4-3.2M24 22.6c1.7 0 2.8-1 2.8-2.6" stroke="var(--moss)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">慢岛生活</span>
    </a>

    <nav class="site-nav" aria-label="主导航">
      <a href="index.html">首页</a>
      <a href="explore.html" aria-current="page">探索</a>
      <a href="about.html">关于</a>
      <a href="member.html">会员</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="explore-shell">

      <!-- 左侧：搜索 + 地图 -->
      <div>

        <!-- 第一行：搜索框 + 类型下拉 + 平台下拉 -->
        <div class="search-row">

          <div class="search-bar">
            <input
              id="searchInput"
              class="search-input"
              type="search"
              placeholder="输入关键词，比如「人工智能」「房价」……"
              aria-label="搜索关键词"
              autocomplete="off"
            >
            <button id="searchClear" class="search-clear" type="button" title="清空全部条件" aria-label="清空全部条件">&#10005;</button>
          </div>

          <!-- 类型下拉 -->
          <div class="dropdown" id="catDropdownWrap">
            <button id="catSelect" class="dd-trigger" type="button" aria-expanded="false" aria-haspopup="listbox">
              <span class="dd-label">类型</span>
              <span id="catCurrent" class="dd-current">全部</span>
              <svg class="dd-caret" viewBox="0 0 10 6" aria-hidden="true">
                <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div id="catPanel" class="dd-panel dd-panel-sm" hidden>
              <div id="catList" class="dd-list"></div>
            </div>
          </div>

          <!-- 平台下拉 -->
          <div class="dropdown" id="portalDropdownWrap">
            <button id="portalSelect" class="dd-trigger" type="button" aria-expanded="false" aria-haspopup="listbox">
              <span id="portalCurIcon" class="dd-cur-icon" hidden></span>
              <span class="dd-label">搜索</span>
              <svg class="dd-caret" viewBox="0 0 10 6" aria-hidden="true">
                <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div id="portalPanel" class="dd-panel" hidden>
              <p class="panel-hint">选一个平台，在新标签页打开已填好查询词的搜索页</p>
              <div id="portalPanelList" class="panel-list"></div>
            </div>
          </div>
        </div>

        <!-- 条件 chips + 面包屑 -->
        <div class="conditions-row">
          <div id="breadcrumb" class="breadcrumb" aria-live="polite"></div>
          <div id="chips" class="chips"></div>
        </div>

        <!-- 地图 -->
        <div class="map-panel">
          <button id="mapBack" class="map-back" type="button" hidden>
            <span aria-hidden="true">←</span> 返回世界
          </button>
          <svg id="map" class="map-svg" role="img" aria-label="世界地图，点击国家进入，再点省份"></svg>
          <p class="map-tip">点国家进入 &middot; 再点省份</p>
        </div>

        <!-- 快捷入口：一行 -->
        <div class="quick-row">
          <span id="portalEmpty" class="quick-hint">选好地区或输入关键词后，这里会出现各平台的搜索入口</span>
          <div id="portalIconRow" class="quick-icons" hidden></div>
        </div>

      </div>

      <!-- 右侧：地区搜索 + 热搜榜 -->
      <aside class="side-panel">

        <!-- 选中地区后才出现的「去这里逛逛」入口 -->
        <div id="regionBlock" class="region-block" hidden>
          <div class="hot-head">
            <h2 id="regionTitle" class="side-title">地区搜索</h2>
          </div>
          <p class="region-sub">点一下，去该地区的实时新闻页</p>
          <div id="regionLinks" class="region-links"></div>
        </div>

        <div class="hot-head">
          <h2 id="hotTitle" class="side-title">热搜榜</h2>
          <span id="hotUpdated" class="hot-updated"></span>
        </div>

        <div id="hotList" class="hot-list">
          <p class="hot-loading">加载中…</p>
        </div>

        <p id="hotFoot" class="hot-foot">数据来自百度热搜，点击跳转</p>
      </aside>

    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; <span id="year">2026</span> 慢岛生活</span>
    <nav class="footer-links" aria-label="页脚导航">
      <a href="about.html">关于慢岛</a>
      <a href="index.html">首页</a>
      <a href="member.html">会员</a>
    </nav>
  </div>
</footer>

<script src="assets/world-map.js"></script>
<script src="assets/cities.js"></script>
<script src="assets/portals.js"></script>
<script src="assets/subdivisions.js"></script>
<script src="assets/hot-news.js"></script>
<script src="assets/region-keywords.js"></script>
<script src="assets/explore.js?v=4"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
