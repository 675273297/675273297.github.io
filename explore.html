<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探索 · 慢岛生活</title>
<meta name="description" content="点选世界地图上的国家与城市，加上类型与关键词，一步跳到各平台已搜好的页面。">
<meta name="theme-color" content="#faf7f2">
<link rel="canonical" href="https://mandao.life/explore.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23faf7f2'/%3E%3Ccircle cx='24' cy='21' r='9.5' fill='none' stroke='%23c67b4e' stroke-width='2'/%3E%3Cpath d='M6 32c4.5-4.2 9-6 18-6s13.5 1.8 18 6' fill='none' stroke='%236b7f5e' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles/global.css">
<link rel="stylesheet" href="styles/explore.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="慢岛生活 首页">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none" role="img" aria-label="慢岛生活">
        <circle cx="24" cy="21" r="9.5" stroke="var(--clay)" stroke-width="1.6" opacity="0.9"/>
        <path d="M6 32c4.5-4.2 9-6 18-6s13.5 1.8 18 6" stroke="var(--moss)" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M9 38.5c3.2 2.4 6.4 2.4 9.6 0s6.4-2.4 9.6 0 6.4 2.4 9.6 0" stroke="var(--moss)" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
        <path d="M24 26v-6M24 24.5c-2.1 0-3.4-1.3-3.4-3.2M24 22.6c1.7 0 2.8-1 2.8-2.6" stroke="var(--moss)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">慢岛生活</span>
    </a>

    <nav class="site-nav" aria-label="主导航">
      <a href="index.html">首页</a>
      <a href="explore.html" aria-current="page">探索</a>
      <a href="about.html">关于</a>
      <a href="member.html">会员</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="explore-shell">

      <!-- 左侧：搜索 + 地图 + 门户 -->
      <div>
        <div class="search-bar">
          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="输入关键词，比如「人工智能」「房价」……"
            aria-label="搜索关键词"
            autocomplete="off"
          >
          <button id="searchClear" class="search-clear" type="button" title="清空全部条件" aria-label="清空全部条件">&#10005;</button>
        </div>

        <div id="chips" class="chips" aria-live="polite"></div>

        <div class="map-panel">
          <svg id="map" class="map-svg" role="img" aria-label="世界地图，点击国家选择地区"></svg>
          <p class="map-tip">点击国家选中 &middot; 再点一次取消</p>
        </div>

        <div class="portal-block">
          <div class="portal-head">
            <h2>去这些地方搜</h2>
            <span id="portalQuery" class="portal-query" style="display:none"></span>
          </div>
          <p id="portalHint" class="portal-hint"></p>
          <div id="portalGrid" class="portal-grid"></div>
        </div>
      </div>

      <!-- 右侧：类型分类 -->
      <aside class="side-panel">
        <h2 class="side-title">内容类型</h2>
        <div id="catList" class="cat-list"></div>
      </aside>

    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; <span id="year">2026</span> 慢岛生活</span>
    <nav class="footer-links" aria-label="页脚导航">
      <a href="about.html">关于慢岛</a>
      <a href="index.html">首页</a>
      <a href="member.html">会员</a>
    </nav>
  </div>
</footer>

<script src="assets/world-map.js"></script>
<script src="assets/cities.js"></script>
<script src="assets/portals.js"></script>
<script src="assets/explore.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
