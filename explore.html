<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探索 · 慢岛生活</title>
<meta name="description" content="点选地图上的国家与省份，加上类型与关键词，一步跳到各平台已搜好的页面。">
<meta name="theme-color" content="#faf7f2">
<link rel="canonical" href="https://mandao.life/explore.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23faf7f2'/%3E%3Ccircle cx='24' cy='21' r='9.5' fill='none' stroke='%23c67b4e' stroke-width='2'/%3E%3Cpath d='M6 32c4.5-4.2 9-6 18-6s13.5 1.8 18 6' fill='none' stroke='%236b7f5e' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles/global.css">
<link rel="stylesheet" href="styles/explore.css?v=7">
<link rel="stylesheet" href="styles/ai-chat.css?v=3">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="慢岛生活 首页">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none" role="img" aria-label="慢岛生活">
        <circle cx="24" cy="21" r="9.5" stroke="var(--clay)" stroke-width="1.6" opacity="0.9"/>
        <path d="M6 32c4.5-4.2 9-6 18-6s13.5 1.8 18 6" stroke="var(--moss)" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M9 38.5c3.2 2.4 6.4 2.4 9.6 0s6.4-2.4 9.6 0 6.4 2.4 9.6 0" stroke="var(--moss)" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
        <path d="M24 26v-6M24 24.5c-2.1 0-3.4-1.3-3.4-3.2M24 22.6c1.7 0 2.8-1 2.8-2.6" stroke="var(--moss)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">慢岛生活</span>
    </a>

    <nav class="site-nav" aria-label="主导航">
      <a href="index.html">首页</a>
      <a href="explore.html" aria-current="page">探索</a>
      <a href="about.html">关于</a>
      <a href="member.html">会员</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap wrap-wide">
    <div class="explore-shell">

      <!-- 左侧：搜索 + 地图 -->
      <div>

        <!-- 第一行：搜索框 + 类型下拉 + 平台下拉 -->
        <div class="search-row">

          <div class="search-bar">
            <input
              id="searchInput"
              class="search-input"
              type="search"
              placeholder="输入关键词，比如「人工智能」「房价」……"
              aria-label="搜索关键词"
              autocomplete="off"
            >
            <button id="searchClear" class="search-clear" type="button" title="清空全部条件" aria-label="清空全部条件">&#10005;</button>
          </div>

          <!-- 类型下拉 -->
          <div class="dropdown" id="catDropdownWrap">
            <button id="catSelect" class="dd-trigger" type="button" aria-expanded="false" aria-haspopup="listbox">
              <span class="dd-label">类型</span>
              <span id="catCurrent" class="dd-current">全部</span>
              <svg class="dd-caret" viewBox="0 0 10 6" aria-hidden="true">
                <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div id="catPanel" class="dd-panel dd-panel-sm" hidden>
              <div id="catList" class="dd-list"></div>
            </div>
          </div>

          <!-- 平台下拉 -->
          <div class="dropdown" id="portalDropdownWrap">
            <button id="portalSelect" class="dd-trigger" type="button" aria-expanded="false" aria-haspopup="listbox">
              <span id="portalCurIcon" class="dd-cur-icon" hidden></span>
              <span class="dd-label">搜索</span>
              <svg class="dd-caret" viewBox="0 0 10 6" aria-hidden="true">
                <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div id="portalPanel" class="dd-panel" hidden>
              <p class="panel-hint">选一个平台，在新标签页打开已填好查询词的搜索页</p>
              <div id="portalPanelList" class="panel-list"></div>
            </div>
          </div>
        </div>

        <!-- 条件 chips + 面包屑 -->
        <div class="conditions-row">
          <div id="breadcrumb" class="breadcrumb" aria-live="polite"></div>
          <div id="chips" class="chips"></div>
        </div>

        <!-- 地图 -->
        <div class="map-panel">
          <button id="mapBack" class="map-back" type="button" hidden>
            <span aria-hidden="true">←</span> 返回世界
          </button>
          <svg id="map" class="map-svg" role="img" aria-label="世界地图，滚轮可缩放，拖动可平移，点击国家进入，再点省份"></svg>
          <div id="mapHover" class="map-hover" hidden aria-hidden="true"></div>

          <div class="map-zoom" role="group" aria-label="地图缩放">
            <button id="zoomIn" class="zoom-btn" type="button" title="放大" aria-label="放大">+</button>
            <button id="zoomOut" class="zoom-btn" type="button" title="缩小" aria-label="缩小">&minus;</button>
            <button id="zoomReset" class="zoom-btn zoom-reset" type="button" title="回到这一层最初的样子" aria-label="回到这一层最初的样子">&#8634;</button>
          </div>

          <p class="map-tip">滚轮缩放 &middot; 拖动平移 &middot; 点国家进入</p>
        </div>

        <!-- 地图下方的门户条：随机漫游 + 世界时钟 -->
        <div class="portal-strip">
          <div class="portal-strip-main">
            <button id="randomBtn" class="random-btn" type="button" title="随机去一个地方">
              <svg class="random-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="8.5" cy="8.5" r="1.4" fill="currentColor"/>
                <circle cx="15.5" cy="15.5" r="1.4" fill="currentColor"/>
                <circle cx="15.5" cy="8.5" r="1.4" fill="currentColor"/>
                <circle cx="8.5" cy="15.5" r="1.4" fill="currentColor"/>
              </svg>
              <span>随便逛逛</span>
            </button>
            <div id="worldClock" class="world-clock" aria-label="世界此刻"></div>
          </div>
          <p id="worldMood" class="world-mood"></p>
        </div>

        <!-- 岛语：AI 闲聊角 -->
        <section class="ai-panel" id="aiPanel" aria-labelledby="aiTitle">
          <div class="ai-head">
            <h2 class="ai-title" id="aiTitle">岛语</h2>
            <span class="ai-sub">想说什么都行</span>
            <div class="ai-head-actions">
              <button id="aiSettingsBtn" class="ai-link-btn" type="button">设置</button>
              <button id="aiClearBtn" class="ai-link-btn" type="button">清空</button>
            </div>
          </div>

          <div class="ai-log" id="aiLog" role="log" aria-live="polite"></div>
          <div class="ai-empty" id="aiEmpty"></div>

          <form class="ai-compose" id="aiForm" autocomplete="off">
            <textarea id="aiInput" class="ai-input" rows="1" placeholder="说点什么…（Enter 发送，Shift + Enter 换行）" aria-label="输入消息"></textarea>
            <button id="aiSend" class="ai-send" type="submit">发送</button>
          </form>

          <p class="ai-foot">
            <span class="ai-status" id="aiStatus" hidden></span>
            <span>密钥只存在这台浏览器里，不会上传。</span>
          </p>

          <div class="ai-settings" id="aiSettings" hidden>
            <div class="ai-provider-tabs" id="aiProviderTabs" role="group" aria-label="选择服务商"></div>

            <div class="ai-field">
              <label for="aiKey">API Key</label>
              <input id="aiKey" type="password" spellcheck="false" autocomplete="off" placeholder="粘贴你的密钥">
            </div>

            <div class="ai-field">
              <label for="aiModel">模型</label>
              <input id="aiModel" type="text" spellcheck="false" autocomplete="off" placeholder="模型名称">
            </div>

            <div class="ai-field">
              <label for="aiBase">接口地址</label>
              <input id="aiBase" type="text" spellcheck="false" autocomplete="off" placeholder="https://…/v1">
            </div>

            <p class="ai-note-line">
              <span id="aiNote"></span>
              <a id="aiKeyUrl" href="#" target="_blank" rel="noopener noreferrer">去领密钥 →</a>
            </p>

            <div class="ai-settings-actions">
              <button id="aiSave" class="ai-btn-solid" type="button">保存</button>
              <button id="aiCancel" class="ai-btn-plain" type="button">取消</button>
            </div>
          </div>
        </section>

      </div>

      <!-- 右侧：多平台热搜（手动切换 + 分页） -->
      <aside class="side-panel">
        <div class="hot-head">
          <h2 class="side-title">热搜榜</h2>
          <span id="hotUpdated" class="hot-updated"></span>
        </div>

        <div id="boardTabs" class="board-tabs" role="tablist" aria-label="选择平台"></div>

        <div id="hotList" class="hot-list" role="tabpanel">
          <p class="hot-loading">加载中…</p>
        </div>

        <div id="hotPager" class="hot-pager"></div>

        <p id="hotFoot" class="hot-foot">点击条目跳转到平台</p>
      </aside>

    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; <span id="year">2026</span> 慢岛生活</span>
    <nav class="footer-links" aria-label="页脚导航">
      <a href="about.html">关于慢岛</a>
      <a href="index.html">首页</a>
      <a href="member.html">会员</a>
    </nav>
  </div>
</footer>

<script src="assets/world-map.js"></script>
<script src="assets/cities.js"></script>
<script src="assets/portals.js"></script>
<script src="assets/subdivisions.js"></script>
<script src="assets/hot-boards.js"></script>
<script src="assets/region-keywords.js"></script>
<script src="assets/explore.js?v=7"></script>
<script src="assets/ai-chat.js?v=3"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
